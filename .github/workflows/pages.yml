name: Publish website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website source
        uses: actions/checkout@v4

      - name: Check out published test reports
        uses: actions/checkout@v4
        with:
          ref: reports
          path: _reports

      - name: Check out the archived report pages
        uses: actions/checkout@v4
        with:
          ref: 5e978dc24e5f5f7325ea95e28472e98497f465f6
          path: _archive

      - uses: actions/configure-pages@v5

      - name: Assemble the site and keep existing report URLs
        run: |
          mkdir -p _site/test _site/test-results
          cp -a website/. _site/
          cp _archive/test/report.html _site/test/
          cp _archive/test-results/index.html _site/test-results/
          cp -a _reports/test-results/. _site/test-results/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
