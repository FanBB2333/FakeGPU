name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff PyYAML jsonschema
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: python -m ruff check fakegpu scripts/validation tests

      - name: Test
        env:
          FAKEGPU_TERMINAL_REPORT: "0"
          PYTHONPATH: .
        run: scripts/test.sh python

      - name: Validate smoke manifest
        env:
          PYTHONPATH: .
        run: |
          python -m fakegpu validate \
            --manifest tests/data/validation_smoke.yaml \
            --report-dir build/validation-smoke \
            --strict

  native:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Native smoke test
        run: scripts/test.sh smoke

      - name: CPU simulation test
        run: scripts/test.sh cpu
