schema_version: fakegpu.validation_manifest.v1

defaults:
  cwd: ../..
  timeout_seconds: 60
  env:
    FAKEGPU_TERMINAL_REPORT: "0"
  expect:
    exit_code: 0

cases:
  - name: kv-cache-allocation
    matrix:
      strategy:
        - dynamic
        - static
        - quantized
        - paged
      prompt_tokens:
        - 4096
        - 32768
    env:
      OUT: "{report_dir}/kv-cache.json"
      STRATEGY: "{strategy}"
      PROMPT_TOKENS: "{prompt_tokens}"
    command:
      - "{python}"
      - -c
      - >-
        import json,os,pathlib;
        from fakegpu import estimate_kv_cache_memory;
        strategy=os.environ["STRATEGY"];
        options=dict(num_hidden_layers=32,num_key_value_heads=8,head_dim=128,batch_size=1,prompt_tokens=int(os.environ["PROMPT_TOKENS"]),generated_tokens=257,element_bytes=2,strategy=strategy,quantized_bits=4,block_tokens=16,max_cache_tokens=65536 if strategy=="static" else None);
        report=estimate_kv_cache_memory(**options);
        pathlib.Path(os.environ["OUT"]).write_text(json.dumps(report),encoding="utf-8");
        print("kv-cache-ok")
    expect:
      stdout_contains: kv-cache-ok
      files_exist: "{report_dir}/kv-cache.json"
      json_checks:
        - path: "{report_dir}/kv-cache.json"
          pointer: /strategy
          op: eq
          value: "{strategy}"
        - path: "{report_dir}/kv-cache.json"
          pointer: /prefill/logical_tokens_per_sequence
          op: approx
          value: "{prompt_tokens}"
          tolerance: 0
        - path: "{report_dir}/kv-cache.json"
          pointer: /generation/allocated_bytes
          op: gt
          value: 0
        - path: "{report_dir}/kv-cache.json"
          pointer: /generation/allocation_utilization_percent
          op: gt
          value: 0

  - name: llm-attention-architecture
    matrix:
      scenario:
        - mha
        - gqa
        - mqa
        - mla
    env:
      OUT: "{report_dir}/llm-attention-architecture.json"
      SCENARIO: "{scenario}"
    command:
      - "{python}"
      - -c
      - >-
        import json,os,pathlib,struct;
        from fakegpu import estimate_decoder_inference;
        scenario=os.environ["SCENARIO"];
        settings=dict(mha=dict(config=dict(num_key_value_heads=8,head_dim=16),kind="multi_head",layout="separate_key_value",elements=256,cache_bytes=67_108_864),gqa=dict(config=dict(num_key_value_heads=2,head_dim=16),kind="grouped_query",layout="separate_key_value",elements=64,cache_bytes=16_777_216),mqa=dict(config=dict(num_key_value_heads=1,head_dim=16),kind="multi_query",layout="separate_key_value",elements=32,cache_bytes=8_388_608),mla=dict(config=dict(q_lora_rank=32,kv_lora_rank=32,qk_nope_head_dim=12,qk_rope_head_dim=4,v_head_dim=12),kind="multi_head_latent",layout="compressed_latent_and_rope",elements=36,cache_bytes=9_437_184));
        selected=settings[scenario];
        output=pathlib.Path(os.environ["OUT"]);
        model=output.parent/"model";
        model.mkdir();
        config=dict(architectures=["ValidationForCausalLM"],model_type="validation",torch_dtype="bfloat16",hidden_size=128,num_hidden_layers=4,num_attention_heads=8,intermediate_size=256,vocab_size=64);
        config.update(selected["config"]);
        (model/"config.json").write_text(json.dumps(config),encoding="utf-8");
        header=dict([("model.embed.weight",dict(dtype="BF16",shape=[64,128],data_offsets=[0,16384]))]);
        encoded=json.dumps(header,separators=(",",":")).encode("utf-8");
        encoded+=b" "*((-len(encoded))%8);
        (model/"model.safetensors").write_bytes(struct.pack("<Q",len(encoded))+encoded+bytes(16384));
        report=estimate_decoder_inference(model,batch_size=8,prompt_tokens=4096,generated_tokens=257,attention_implementation="sdpa",kv_cache_strategy="paged",kv_cache_block_tokens=16);
        assert report["model"]["attention_kind"]==selected["kind"];
        assert report["kv_cache"]["cache_layout"]==selected["layout"];
        assert report["kv_cache"]["elements_per_token_per_layer"]==selected["elements"];
        assert report["kv_cache"]["prefill"]["allocated_bytes"]==selected["cache_bytes"];
        output.write_text(json.dumps(dict(scenario=scenario,report=report)),encoding="utf-8");
        print("llm-attention-architecture-ok")
    expect:
      stdout_contains: llm-attention-architecture-ok
      files_exist: "{report_dir}/llm-attention-architecture.json"
      json_checks:
        - path: "{report_dir}/llm-attention-architecture.json"
          pointer: /scenario
          op: eq
          value: "{scenario}"
        - path: "{report_dir}/llm-attention-architecture.json"
          pointer: /report/kv_cache/prefill/allocated_bytes
          op: gt
          value: 0
        - path: "{report_dir}/llm-attention-architecture.json"
          pointer: /report/compute/total_flops
          op: gt
          value: 0

  - name: distributed-training-plan
    matrix:
      strategy:
        - replicated
        - shard_grad_op
        - full_shard
    env:
      OUT: "{report_dir}/training-plan.json"
      STRATEGY: "{strategy}"
    command:
      - "{python}"
      - -c
      - >-
        import json,os,pathlib;
        from fakegpu import estimate_training_plan;
        config=dict(sharding_strategy=os.environ["STRATEGY"],world_size=4,mixed_precision="bf16",activation_checkpointing=True);
        report=estimate_training_plan(config,parameter_bytes=16_000_000_000,activation_bytes=8_000_000_000);
        pathlib.Path(os.environ["OUT"]).write_text(json.dumps(report),encoding="utf-8");
        print("training-plan-ok")
    expect:
      stdout_contains: training-plan-ok
      files_exist: "{report_dir}/training-plan.json"
      json_checks:
        - path: "{report_dir}/training-plan.json"
          pointer: /sharding/strategy
          op: eq
          value: "{strategy}"
        - path: "{report_dir}/training-plan.json"
          pointer: /inputs/world_size
          op: eq
          value: 4
        - path: "{report_dir}/training-plan.json"
          pointer: /estimated_rank_peak_bytes
          op: gt
          value: 0

  - name: calibration-reliability
    env:
      OUT: "{report_dir}/calibration-verification.json"
    command:
      - "{python}"
      - -c
      - >-
        import json,os,pathlib;
        from fakegpu import compare_memory_reports,verify_calibration_reports;
        prediction=dict(schema_version="validation_prediction.v1",inputs=dict(batch_size=1,dtype="bfloat16"),memory_timeline=dict(phases=[dict(phase="peak",peak_bytes=970,interval_bytes=dict(lower=950,expected=970,upper=1050))]));
        observation=dict(schema_version="validation_observation.v1",inputs=dict(batch_size=1,dtype="bfloat16"),memory_timeline=dict(phases=[dict(phase="peak",peak_bytes=1000)]));
        comparison=compare_memory_reports(prediction,observation,workload="llm-validation");
        report=verify_calibration_reports([comparison],max_underestimate_percent=5,max_absolute_percentage_error_percent=5,min_interval_coverage_percent=100,capacity_bytes=1100);
        pathlib.Path(os.environ["OUT"]).write_text(json.dumps(report),encoding="utf-8");
        assert report["status"]=="passed";
        print("calibration-ok")
    expect:
      stdout_contains: calibration-ok
      files_exist: "{report_dir}/calibration-verification.json"
      json_checks:
        - path: "{report_dir}/calibration-verification.json"
          pointer: /status
          op: eq
          value: passed
        - path: "{report_dir}/calibration-verification.json"
          pointer: /metrics/maximum_underestimate_percent
          op: approx
          value: 3
          tolerance: 0.000001
        - path: "{report_dir}/calibration-verification.json"
          pointer: /metrics/false_safe_count
          op: eq
          value: 0

  - name: speculative-serving-calibration
    matrix:
      speculative_tokens:
        - 1
        - 5
    env:
      OUT: "{report_dir}/speculative-serving-calibration.json"
      SPECULATIVE_TOKENS: "{speculative_tokens}"
    command:
      - "{python}"
      - -c
      - >-
        import json,os,pathlib,struct;
        from fakegpu import build_serving_memory_observation,compare_memory_reports,estimate_serving_plan,verify_calibration_reports;
        root=pathlib.Path(os.environ["OUT"]).parent;
        target=root/"target";
        draft=root/"draft";
        target.mkdir();
        draft.mkdir();
        target_config=dict(architectures=["ValidationTargetForCausalLM"],model_type="validation-target",torch_dtype="bfloat16",hidden_size=8,num_hidden_layers=2,num_attention_heads=2,num_key_value_heads=1,head_dim=4,intermediate_size=16,vocab_size=32);
        draft_config=dict(architectures=["ValidationDraftForCausalLM"],model_type="validation-draft",torch_dtype="bfloat16",hidden_size=4,num_hidden_layers=1,num_attention_heads=1,num_key_value_heads=1,head_dim=4,intermediate_size=8,vocab_size=32);
        (target/"config.json").write_text(json.dumps(target_config),encoding="utf-8");
        (draft/"config.json").write_text(json.dumps(draft_config),encoding="utf-8");
        target_header=dict([("model.embed.weight",dict(dtype="BF16",shape=[32,8],data_offsets=[0,512]))]);
        draft_header=dict([("model.embed.weight",dict(dtype="BF16",shape=[32,4],data_offsets=[0,256]))]);
        target_encoded=json.dumps(target_header,separators=(",",":")).encode("utf-8");
        target_encoded+=b" "*((-len(target_encoded))%8);
        draft_encoded=json.dumps(draft_header,separators=(",",":")).encode("utf-8");
        draft_encoded+=b" "*((-len(draft_encoded))%8);
        (target/"model.safetensors").write_bytes(struct.pack("<Q",len(target_encoded))+target_encoded+bytes(512));
        (draft/"model.safetensors").write_bytes(struct.pack("<Q",len(draft_encoded))+draft_encoded+bytes(256));
        tokens=int(os.environ["SPECULATIVE_TOKENS"]);
        common=dict(active_sequences=2,max_batch_size=8,prompt_tokens=64,generated_tokens=16,kv_cache_strategy="paged",draft_model_dir=draft,speculative_acceptance_rate=0.5,target_profile="a100");
        plan=estimate_serving_plan(target,speculative_tokens=tokens,**common);
        drifted_plan=estimate_serving_plan(target,speculative_tokens=tokens+1,**common);
        samples=lambda item: dict((phase["phase"],[phase["peak_bytes"]]*5) for phase in item["memory_timeline"]["phases"]);
        observation=build_serving_memory_observation(plan,phase_samples=samples(plan));
        drifted_observation=build_serving_memory_observation(drifted_plan,phase_samples=samples(drifted_plan));
        matching=compare_memory_reports(plan,observation,workload="speculative-serving");
        matching_gate=verify_calibration_reports([matching],max_underestimate_percent=0,max_absolute_percentage_error_percent=0);
        drifted=compare_memory_reports(plan,drifted_observation,workload="speculative-serving");
        drifted_gate=verify_calibration_reports([drifted],max_underestimate_percent=100);
        assert matching_gate["status"]=="passed";
        assert drifted_gate["status"]=="failed";
        payload=dict(plan=plan,observation=observation,matching_status=matching_gate["status"],drift_status=drifted_gate["status"],drift_dimension_mismatch_count=drifted_gate["metrics"]["dimension_mismatch_count"]);
        pathlib.Path(os.environ["OUT"]).write_text(json.dumps(payload),encoding="utf-8");
        print("speculative-serving-calibration-ok")
    expect:
      stdout_contains: speculative-serving-calibration-ok
      files_exist: "{report_dir}/speculative-serving-calibration.json"
      json_checks:
        - path: "{report_dir}/speculative-serving-calibration.json"
          pointer: /plan/workload_signature
          op: contains
          value: "fakegpu.serving_workload.v1:sha256:"
        - path: "{report_dir}/speculative-serving-calibration.json"
          pointer: /plan/speculative_decoding/proposal_tokens_per_step
          op: approx
          value: "{speculative_tokens}"
          tolerance: 0
        - path: "{report_dir}/speculative-serving-calibration.json"
          pointer: /matching_status
          op: eq
          value: passed
        - path: "{report_dir}/speculative-serving-calibration.json"
          pointer: /observation/evidence_status
          op: eq
          value: ready_for_comparison
        - path: "{report_dir}/speculative-serving-calibration.json"
          pointer: /observation/measurement/phase_sample_counts/prefill
          op: eq
          value: 5
        - path: "{report_dir}/speculative-serving-calibration.json"
          pointer: /drift_status
          op: eq
          value: failed
        - path: "{report_dir}/speculative-serving-calibration.json"
          pointer: /drift_dimension_mismatch_count
          op: eq
          value: 1

  - name: online-serving-kv-pool
    matrix:
      active_sequences:
        - 4
        - 8
      shared_prefix_tokens:
        - 0
        - 1024
    env:
      ACTIVE_SEQUENCES: "{active_sequences}"
      OUT: "{report_dir}/serving-kv-pool.json"
      SHARED_PREFIX_TOKENS: "{shared_prefix_tokens}"
    command:
      - "{python}"
      - -c
      - >-
        import json,os,pathlib;
        from fakegpu import estimate_serving_kv_pool;
        active=int(os.environ["ACTIVE_SEQUENCES"]);
        prefix=int(os.environ["SHARED_PREFIX_TOKENS"]);
        report=estimate_serving_kv_pool(num_hidden_layers=32,num_key_value_heads=8,head_dim=128,active_sequences=active,prompt_tokens=4096,generated_tokens=257,element_bytes=2,strategy="paged",shared_prefix_tokens=prefix,block_tokens=16);
        payload=dict(schema_version="fakegpu.serving_kv_pool_validation.v1",validation_status="Modeled",kv_cache=report);
        pathlib.Path(os.environ["OUT"]).write_text(json.dumps(payload),encoding="utf-8");
        print("serving-kv-pool-ok")
    expect:
      stdout_contains: serving-kv-pool-ok
      files_exist: "{report_dir}/serving-kv-pool.json"
      json_checks:
        - path: "{report_dir}/serving-kv-pool.json"
          pointer: /validation_status
          op: eq
          value: Modeled
        - path: "{report_dir}/serving-kv-pool.json"
          pointer: /kv_cache/active_sequences
          op: approx
          value: "{active_sequences}"
          tolerance: 0
        - path: "{report_dir}/serving-kv-pool.json"
          pointer: /kv_cache/shared_prefix_tokens
          op: approx
          value: "{shared_prefix_tokens}"
          tolerance: 0
        - path: "{report_dir}/serving-kv-pool.json"
          pointer: /kv_cache/decode/allocated_bytes
          op: gt
          value: 0

  - name: heterogeneous-serving-request-set
    matrix:
      workload:
        - chat
        - rag
    env:
      OUT: "{report_dir}/heterogeneous-serving-request-set.json"
      WORKLOAD: "{workload}"
    command:
      - "{python}"
      - -c
      - >-
        import json,os,pathlib;
        from fakegpu import estimate_serving_request_kv_pool;
        scenarios=dict(chat=[dict(id="chat-a",prompt_tokens=4096,generated_tokens=257,prefix_group="system",shared_prefix_tokens=1024),dict(id="chat-b",prompt_tokens=8192,generated_tokens=513,prefix_group="system",shared_prefix_tokens=1024),dict(id="completion",prompt_tokens=2048,generated_tokens=1025)],rag=[dict(id="rag-a",prompt_tokens=6144,generated_tokens=257,prefix_group="retrieval",shared_prefix_tokens=1536),dict(id="rag-b",prompt_tokens=10240,generated_tokens=129,prefix_group="retrieval",shared_prefix_tokens=1536),dict(id="summary",prompt_tokens=3072,generated_tokens=513)]);
        workload=os.environ["WORKLOAD"];
        report=estimate_serving_request_kv_pool(scenarios[workload],num_hidden_layers=32,num_key_value_heads=8,head_dim=128,element_bytes=2,strategy="paged",block_tokens=16);
        payload=dict(schema_version="fakegpu.heterogeneous_serving_validation.v1",validation_status="Modeled",workload=workload,kv_cache=report);
        pathlib.Path(os.environ["OUT"]).write_text(json.dumps(payload),encoding="utf-8");
        assert report["decode"]["prefix_cache_savings_bytes"]>0;
        print("heterogeneous-serving-ok")
    expect:
      stdout_contains: heterogeneous-serving-ok
      files_exist: "{report_dir}/heterogeneous-serving-request-set.json"
      json_checks:
        - path: "{report_dir}/heterogeneous-serving-request-set.json"
          pointer: /validation_status
          op: eq
          value: Modeled
        - path: "{report_dir}/heterogeneous-serving-request-set.json"
          pointer: /kv_cache/request_count
          op: approx
          value: 3
          tolerance: 0
        - path: "{report_dir}/heterogeneous-serving-request-set.json"
          pointer: /kv_cache/decode/prefix_cache_savings_bytes
          op: gt
          value: 0

  - name: vllm-runtime-budget
    matrix:
      sizing:
        - automatic
        - explicit
    env:
      OUT: "{report_dir}/vllm-runtime-budget.json"
      SIZING: "{sizing}"
    command:
      - "{python}"
      - -c
      - >-
        import json,math,os,pathlib,struct;
        from fakegpu import estimate_serving_plan;
        output=pathlib.Path(os.environ["OUT"]);
        model=output.parent/"model";
        model.mkdir();
        config=dict(architectures=["ValidationForCausalLM"],model_type="validation",torch_dtype="bfloat16",hidden_size=8,num_hidden_layers=2,num_attention_heads=2,num_key_value_heads=1,head_dim=4,intermediate_size=16,vocab_size=32);
        (model/"config.json").write_text(json.dumps(config),encoding="utf-8");
        header=dict([("model.embed.weight",dict(dtype="BF16",shape=[32,8],data_offsets=[0,512]))]);
        encoded=json.dumps(header,separators=(",",":")).encode("utf-8");
        encoded+=b" "*((-len(encoded))%8);
        (model/"model.safetensors").write_bytes(struct.pack("<Q",len(encoded))+encoded+bytes(512));
        sizing=os.environ["SIZING"];
        options=dict(active_sequences=4,max_batch_size=16,prompt_tokens=4096,generated_tokens=257,runtime="vllm",device_capacity_bytes=2**30,memory_utilization=0.75);
        options.update(dict(vllm_kv_cache_memory_bytes=128*2**20,vllm_non_kv_cache_memory_bytes=64*2**20) if sizing=="explicit" else dict());
        report=estimate_serving_plan(model,**options);
        payload=dict(sizing=sizing,report=report);
        output.write_text(json.dumps(payload),encoding="utf-8");
        assert report["runtime"]["kv_cache"]["num_gpu_blocks"]>0;
        assert report["scheduler"]["requested_fits"] is True;
        print("vllm-runtime-budget-ok")
    expect:
      stdout_contains: vllm-runtime-budget-ok
      files_exist: "{report_dir}/vllm-runtime-budget.json"
      json_checks:
        - path: "{report_dir}/vllm-runtime-budget.json"
          pointer: /sizing
          op: eq
          value: "{sizing}"
        - path: "{report_dir}/vllm-runtime-budget.json"
          pointer: /report/runtime/engine
          op: eq
          value: vllm
        - path: "{report_dir}/vllm-runtime-budget.json"
          pointer: /report/runtime/kv_cache/num_gpu_blocks
          op: gt
          value: 0
        - path: "{report_dir}/vllm-runtime-budget.json"
          pointer: /report/inputs/runtime
          op: eq
          value: vllm
        - path: "{report_dir}/vllm-runtime-budget.json"
          pointer: /report/scheduler/requested_fits
          op: eq
          value: true

  - name: diffusion-generation
    matrix:
      model_profile:
        - stable-diffusion-v1-5
        - stable-diffusion-xl-base-1.0
        - pixart-sigma-xl-2-1024-ms
      offload:
        - none
        - model
    command:
      - "{python}"
      - -m
      - fakegpu
      - estimate-diffusion
      - --model-profile
      - "{model_profile}"
      - --offload
      - "{offload}"
      - --target-profile
      - a100
      - --json
      - "{report_dir}/diffusion.json"
    expect:
      stdout_contains: "Diffusion estimate:"
      files_exist: "{report_dir}/diffusion.json"
      json_checks:
        - path: "{report_dir}/diffusion.json"
          pointer: /schema_version
          op: eq
          value: fakegpu.diffusion_generation_estimate.v1
        - path: "{report_dir}/diffusion.json"
          pointer: /model_profile/id
          op: eq
          value: "{model_profile}"
        - path: "{report_dir}/diffusion.json"
          pointer: /inputs/offload
          op: eq
          value: "{offload}"
        - path: "{report_dir}/diffusion.json"
          pointer: /memory_timeline/peak_bytes
          op: gt
          value: 0
        - path: "{report_dir}/diffusion.json"
          pointer: /fit/fits
          op: eq
          value: true
        - path: "{report_dir}/diffusion.json"
          pointer: /validation_status
          op: eq
          value: Modeled

  - name: diffusion-local-architecture
    matrix:
      scenario:
        - unet
        - cross-dit
        - joint-dit
    env:
      OUT: "{report_dir}/diffusion-local-architecture.json"
      SCENARIO: "{scenario}"
    command:
      - "{python}"
      - -c
      - |
        import json
        import os
        import pathlib
        import struct
        from fakegpu import estimate_diffusion_generation

        scenario = os.environ["SCENARIO"]
        output = pathlib.Path(os.environ["OUT"])
        model = output.parent / "pipeline"
        model.mkdir()
        if scenario == "unet":
            pipeline_class = "StableDiffusionPipeline"
            denoiser_name = "unet"
            denoiser_class = "UNet2DConditionModel"
            denoiser_config = dict(
                _class_name=denoiser_class,
                sample_size=8,
                in_channels=4,
                block_out_channels=[8, 16],
                layers_per_block=[1, 2],
                down_block_types=["CrossAttnDownBlock2D", "DownBlock2D"],
                attention_head_dim=[2, 4],
                transformer_layers_per_block=[1, 0],
                cross_attention_dim=8,
            )
            latent_channels = 4
            expected_family = "unet"
            expected_pattern = None
        elif scenario == "cross-dit":
            pipeline_class = "PixArtSigmaPipeline"
            denoiser_name = "transformer"
            denoiser_class = "PixArtTransformer2DModel"
            denoiser_config = dict(
                _class_name=denoiser_class,
                sample_size=16,
                in_channels=4,
                num_layers=3,
                num_single_layers=0,
                num_attention_heads=2,
                attention_head_dim=4,
                patch_size=2,
                cross_attention_dim=8,
            )
            latent_channels = 4
            expected_family = "transformer"
            expected_pattern = "cross"
        else:
            pipeline_class = "FluxPipeline"
            denoiser_name = "transformer"
            denoiser_class = "FluxTransformer2DModel"
            denoiser_config = dict(
                _class_name=denoiser_class,
                sample_size=8,
                in_channels=64,
                num_layers=2,
                num_single_layers=1,
                num_attention_heads=2,
                attention_head_dim=4,
                patch_size=1,
                joint_attention_dim=8,
            )
            latent_channels = 16
            expected_family = "transformer"
            expected_pattern = "joint"

        model_index = dict(
            _class_name=pipeline_class,
            text_encoder=["transformers", "T5EncoderModel"],
            vae=["diffusers", "AutoencoderKL"],
        )
        model_index[denoiser_name] = ["diffusers", denoiser_class]
        (model / "model_index.json").write_text(
            json.dumps(model_index), encoding="utf-8"
        )
        component_configs = dict(
            text_encoder=dict(
                _class_name="T5EncoderModel",
                d_model=16,
                num_layers=2,
                n_positions=512,
            ),
            vae=dict(
                _class_name="AutoencoderKL",
                latent_channels=latent_channels,
                block_out_channels=[4, 8, 16, 16],
                layers_per_block=1,
            ),
        )
        component_configs[denoiser_name] = denoiser_config
        for name, config in component_configs.items():
            component = model / name
            component.mkdir()
            (component / "config.json").write_text(
                json.dumps(config), encoding="utf-8"
            )
            header = dict()
            header[name + ".weight"] = dict(
                dtype="F16",
                shape=[4, 4],
                data_offsets=[0, 32],
            )
            encoded = json.dumps(
                header, separators=(",", ":")
            ).encode("utf-8")
            encoded += b" " * ((-len(encoded)) % 8)
            filename = (
                "model.safetensors"
                if name == "text_encoder"
                else "diffusion_pytorch_model.safetensors"
            )
            (component / filename).write_bytes(
                struct.pack("<Q", len(encoded)) + encoded + bytes(32)
            )

        report = estimate_diffusion_generation(
            model_dir=model,
            text_tokens=32,
            offload="model",
        )
        assert report["architecture"]["denoiser_family"] == expected_family
        assert report["architecture"]["attention_pattern"] == expected_pattern
        if scenario == "joint-dit":
            assert report["architecture"]["guidance_mode"] == "embedded"
            assert report["inputs"]["classifier_free_guidance"] is False
        output.write_text(
            json.dumps(dict(scenario=scenario, report=report)),
            encoding="utf-8",
        )
        print("diffusion-local-architecture-ok")
    expect:
      stdout_contains: diffusion-local-architecture-ok
      files_exist: "{report_dir}/diffusion-local-architecture.json"
      json_checks:
        - path: "{report_dir}/diffusion-local-architecture.json"
          pointer: /scenario
          op: eq
          value: "{scenario}"
        - path: "{report_dir}/diffusion-local-architecture.json"
          pointer: /report/model_profile/source_kind
          op: eq
          value: local_diffusers_pipeline
        - path: "{report_dir}/diffusion-local-architecture.json"
          pointer: /report/memory_timeline/peak_bytes
          op: gt
          value: 0
        - path: "{report_dir}/diffusion-local-architecture.json"
          pointer: /report/validation_status
          op: eq
          value: Modeled

  - name: diffusion-shape-optimizations
    matrix:
      scenario:
        - sdxl-batch4
        - sdxl-batch4-vae-slicing
        - sdxl-2048
        - sdxl-2048-vae-tiling
    env:
      OUT: "{report_dir}/diffusion-shape.json"
      SCENARIO: "{scenario}"
    command:
      - "{python}"
      - -c
      - >-
        import json,os,pathlib;
        from fakegpu import estimate_diffusion_generation;
        scenario=os.environ["SCENARIO"];
        options=dict(model_profile="stable-diffusion-xl-base-1.0",batch_size=4 if "batch4" in scenario else 1,height=2048 if "2048" in scenario else 1024,width=2048 if "2048" in scenario else 1024,vae_slicing="slicing" in scenario,vae_tiling="tiling" in scenario);
        report=estimate_diffusion_generation(**options);
        payload=dict(scenario=scenario,report=report);
        pathlib.Path(os.environ["OUT"]).write_text(json.dumps(payload),encoding="utf-8");
        print("diffusion-shape-ok")
    expect:
      stdout_contains: diffusion-shape-ok
      files_exist: "{report_dir}/diffusion-shape.json"
      json_checks:
        - path: "{report_dir}/diffusion-shape.json"
          pointer: /scenario
          op: eq
          value: "{scenario}"
        - path: "{report_dir}/diffusion-shape.json"
          pointer: /report/memory_timeline/peak_bytes
          op: gt
          value: 0
        - path: "{report_dir}/diffusion-shape.json"
          pointer: /report/validation_status
          op: eq
          value: Modeled
