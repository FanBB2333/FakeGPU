schema_version: fakegpu.validation_manifest.v1

defaults:
  cwd: ../..
  timeout_seconds: 60
  env:
    FAKEGPU_TERMINAL_REPORT: "0"
  expect:
    exit_code: 0

cases:
  - name: kv-cache-allocation
    matrix:
      strategy:
        - dynamic
        - static
        - quantized
        - paged
      prompt_tokens:
        - 4096
        - 32768
    env:
      OUT: "{report_dir}/kv-cache.json"
      STRATEGY: "{strategy}"
      PROMPT_TOKENS: "{prompt_tokens}"
    command:
      - "{python}"
      - -c
      - >-
        import json,os,pathlib;
        from fakegpu import estimate_kv_cache_memory;
        strategy=os.environ["STRATEGY"];
        options=dict(num_hidden_layers=32,num_key_value_heads=8,head_dim=128,batch_size=1,prompt_tokens=int(os.environ["PROMPT_TOKENS"]),generated_tokens=257,element_bytes=2,strategy=strategy,quantized_bits=4,block_tokens=16,max_cache_tokens=65536 if strategy=="static" else None);
        report=estimate_kv_cache_memory(**options);
        pathlib.Path(os.environ["OUT"]).write_text(json.dumps(report),encoding="utf-8");
        print("kv-cache-ok")
    expect:
      stdout_contains: kv-cache-ok
      files_exist: "{report_dir}/kv-cache.json"
      json_checks:
        - path: "{report_dir}/kv-cache.json"
          pointer: /strategy
          op: eq
          value: "{strategy}"
        - path: "{report_dir}/kv-cache.json"
          pointer: /prefill/logical_tokens_per_sequence
          op: approx
          value: "{prompt_tokens}"
          tolerance: 0
        - path: "{report_dir}/kv-cache.json"
          pointer: /generation/allocated_bytes
          op: gt
          value: 0
        - path: "{report_dir}/kv-cache.json"
          pointer: /generation/allocation_utilization_percent
          op: gt
          value: 0

  - name: distributed-training-plan
    matrix:
      strategy:
        - replicated
        - shard_grad_op
        - full_shard
    env:
      OUT: "{report_dir}/training-plan.json"
      STRATEGY: "{strategy}"
    command:
      - "{python}"
      - -c
      - >-
        import json,os,pathlib;
        from fakegpu import estimate_training_plan;
        config=dict(sharding_strategy=os.environ["STRATEGY"],world_size=4,mixed_precision="bf16",activation_checkpointing=True);
        report=estimate_training_plan(config,parameter_bytes=16_000_000_000,activation_bytes=8_000_000_000);
        pathlib.Path(os.environ["OUT"]).write_text(json.dumps(report),encoding="utf-8");
        print("training-plan-ok")
    expect:
      stdout_contains: training-plan-ok
      files_exist: "{report_dir}/training-plan.json"
      json_checks:
        - path: "{report_dir}/training-plan.json"
          pointer: /sharding/strategy
          op: eq
          value: "{strategy}"
        - path: "{report_dir}/training-plan.json"
          pointer: /inputs/world_size
          op: eq
          value: 4
        - path: "{report_dir}/training-plan.json"
          pointer: /estimated_rank_peak_bytes
          op: gt
          value: 0

  - name: calibration-reliability
    env:
      OUT: "{report_dir}/calibration-verification.json"
    command:
      - "{python}"
      - -c
      - >-
        import json,os,pathlib;
        from fakegpu import compare_memory_reports,verify_calibration_reports;
        prediction=dict(schema_version="validation_prediction.v1",inputs=dict(batch_size=1,dtype="bfloat16"),memory_timeline=dict(phases=[dict(phase="peak",peak_bytes=970,interval_bytes=dict(lower=950,expected=970,upper=1050))]));
        observation=dict(schema_version="validation_observation.v1",inputs=dict(batch_size=1,dtype="bfloat16"),memory_timeline=dict(phases=[dict(phase="peak",peak_bytes=1000)]));
        comparison=compare_memory_reports(prediction,observation,workload="llm-validation");
        report=verify_calibration_reports([comparison],max_underestimate_percent=5,max_absolute_percentage_error_percent=5,min_interval_coverage_percent=100,capacity_bytes=1100);
        pathlib.Path(os.environ["OUT"]).write_text(json.dumps(report),encoding="utf-8");
        assert report["status"]=="passed";
        print("calibration-ok")
    expect:
      stdout_contains: calibration-ok
      files_exist: "{report_dir}/calibration-verification.json"
      json_checks:
        - path: "{report_dir}/calibration-verification.json"
          pointer: /status
          op: eq
          value: passed
        - path: "{report_dir}/calibration-verification.json"
          pointer: /metrics/maximum_underestimate_percent
          op: approx
          value: 3
          tolerance: 0.000001
        - path: "{report_dir}/calibration-verification.json"
          pointer: /metrics/false_safe_count
          op: eq
          value: 0

  - name: online-serving-kv-pool
    matrix:
      active_sequences:
        - 4
        - 8
      shared_prefix_tokens:
        - 0
        - 1024
    env:
      ACTIVE_SEQUENCES: "{active_sequences}"
      OUT: "{report_dir}/serving-kv-pool.json"
      SHARED_PREFIX_TOKENS: "{shared_prefix_tokens}"
    command:
      - "{python}"
      - -c
      - >-
        import json,os,pathlib;
        from fakegpu import estimate_serving_kv_pool;
        active=int(os.environ["ACTIVE_SEQUENCES"]);
        prefix=int(os.environ["SHARED_PREFIX_TOKENS"]);
        report=estimate_serving_kv_pool(num_hidden_layers=32,num_key_value_heads=8,head_dim=128,active_sequences=active,prompt_tokens=4096,generated_tokens=257,element_bytes=2,strategy="paged",shared_prefix_tokens=prefix,block_tokens=16);
        payload=dict(schema_version="fakegpu.serving_kv_pool_validation.v1",validation_status="Modeled",kv_cache=report);
        pathlib.Path(os.environ["OUT"]).write_text(json.dumps(payload),encoding="utf-8");
        print("serving-kv-pool-ok")
    expect:
      stdout_contains: serving-kv-pool-ok
      files_exist: "{report_dir}/serving-kv-pool.json"
      json_checks:
        - path: "{report_dir}/serving-kv-pool.json"
          pointer: /validation_status
          op: eq
          value: Modeled
        - path: "{report_dir}/serving-kv-pool.json"
          pointer: /kv_cache/active_sequences
          op: approx
          value: "{active_sequences}"
          tolerance: 0
        - path: "{report_dir}/serving-kv-pool.json"
          pointer: /kv_cache/shared_prefix_tokens
          op: approx
          value: "{shared_prefix_tokens}"
          tolerance: 0
        - path: "{report_dir}/serving-kv-pool.json"
          pointer: /kv_cache/decode/allocated_bytes
          op: gt
          value: 0

  - name: heterogeneous-serving-request-set
    matrix:
      workload:
        - chat
        - rag
    env:
      OUT: "{report_dir}/heterogeneous-serving-request-set.json"
      WORKLOAD: "{workload}"
    command:
      - "{python}"
      - -c
      - >-
        import json,os,pathlib;
        from fakegpu import estimate_serving_request_kv_pool;
        scenarios=dict(chat=[dict(id="chat-a",prompt_tokens=4096,generated_tokens=257,prefix_group="system",shared_prefix_tokens=1024),dict(id="chat-b",prompt_tokens=8192,generated_tokens=513,prefix_group="system",shared_prefix_tokens=1024),dict(id="completion",prompt_tokens=2048,generated_tokens=1025)],rag=[dict(id="rag-a",prompt_tokens=6144,generated_tokens=257,prefix_group="retrieval",shared_prefix_tokens=1536),dict(id="rag-b",prompt_tokens=10240,generated_tokens=129,prefix_group="retrieval",shared_prefix_tokens=1536),dict(id="summary",prompt_tokens=3072,generated_tokens=513)]);
        workload=os.environ["WORKLOAD"];
        report=estimate_serving_request_kv_pool(scenarios[workload],num_hidden_layers=32,num_key_value_heads=8,head_dim=128,element_bytes=2,strategy="paged",block_tokens=16);
        payload=dict(schema_version="fakegpu.heterogeneous_serving_validation.v1",validation_status="Modeled",workload=workload,kv_cache=report);
        pathlib.Path(os.environ["OUT"]).write_text(json.dumps(payload),encoding="utf-8");
        assert report["decode"]["prefix_cache_savings_bytes"]>0;
        print("heterogeneous-serving-ok")
    expect:
      stdout_contains: heterogeneous-serving-ok
      files_exist: "{report_dir}/heterogeneous-serving-request-set.json"
      json_checks:
        - path: "{report_dir}/heterogeneous-serving-request-set.json"
          pointer: /validation_status
          op: eq
          value: Modeled
        - path: "{report_dir}/heterogeneous-serving-request-set.json"
          pointer: /kv_cache/request_count
          op: approx
          value: 3
          tolerance: 0
        - path: "{report_dir}/heterogeneous-serving-request-set.json"
          pointer: /kv_cache/decode/prefix_cache_savings_bytes
          op: gt
          value: 0

  - name: diffusion-generation
    matrix:
      model_profile:
        - stable-diffusion-v1-5
        - stable-diffusion-xl-base-1.0
        - pixart-sigma-xl-2-1024-ms
      offload:
        - none
        - model
    command:
      - "{python}"
      - -m
      - fakegpu
      - estimate-diffusion
      - --model-profile
      - "{model_profile}"
      - --offload
      - "{offload}"
      - --target-profile
      - a100
      - --json
      - "{report_dir}/diffusion.json"
    expect:
      stdout_contains: "Diffusion estimate:"
      files_exist: "{report_dir}/diffusion.json"
      json_checks:
        - path: "{report_dir}/diffusion.json"
          pointer: /schema_version
          op: eq
          value: fakegpu.diffusion_generation_estimate.v1
        - path: "{report_dir}/diffusion.json"
          pointer: /model_profile/id
          op: eq
          value: "{model_profile}"
        - path: "{report_dir}/diffusion.json"
          pointer: /inputs/offload
          op: eq
          value: "{offload}"
        - path: "{report_dir}/diffusion.json"
          pointer: /memory_timeline/peak_bytes
          op: gt
          value: 0
        - path: "{report_dir}/diffusion.json"
          pointer: /fit/fits
          op: eq
          value: true
        - path: "{report_dir}/diffusion.json"
          pointer: /validation_status
          op: eq
          value: Modeled

  - name: diffusion-shape-optimizations
    matrix:
      scenario:
        - sdxl-batch4
        - sdxl-batch4-vae-slicing
        - sdxl-2048
        - sdxl-2048-vae-tiling
    env:
      OUT: "{report_dir}/diffusion-shape.json"
      SCENARIO: "{scenario}"
    command:
      - "{python}"
      - -c
      - >-
        import json,os,pathlib;
        from fakegpu import estimate_diffusion_generation;
        scenario=os.environ["SCENARIO"];
        options=dict(model_profile="stable-diffusion-xl-base-1.0",batch_size=4 if "batch4" in scenario else 1,height=2048 if "2048" in scenario else 1024,width=2048 if "2048" in scenario else 1024,vae_slicing="slicing" in scenario,vae_tiling="tiling" in scenario);
        report=estimate_diffusion_generation(**options);
        payload=dict(scenario=scenario,report=report);
        pathlib.Path(os.environ["OUT"]).write_text(json.dumps(payload),encoding="utf-8");
        print("diffusion-shape-ok")
    expect:
      stdout_contains: diffusion-shape-ok
      files_exist: "{report_dir}/diffusion-shape.json"
      json_checks:
        - path: "{report_dir}/diffusion-shape.json"
          pointer: /scenario
          op: eq
          value: "{scenario}"
        - path: "{report_dir}/diffusion-shape.json"
          pointer: /report/memory_timeline/peak_bytes
          op: gt
          value: 0
        - path: "{report_dir}/diffusion-shape.json"
          pointer: /report/validation_status
          op: eq
          value: Modeled
