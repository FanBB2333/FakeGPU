notes: NVIDIA announces this laptop model at https://www.nvidia.com/en-in/geforce/news/geforce-rtx-laptop-new-options/ . A public original CUDA deviceQuery report verifies compute capability 8.6, 16 SMs, 64-bit bus and 1 MiB L2. Its outdated core-mapping helper incorrectly prints 192 cores/SM; 2048 CUDA cores are derived as 16 x 128 for Ampere 8.6. Clocks/power remain unspecified to avoid treating one reported laptop configuration as a universal limit. Nominal 4 GB GDDR6 capacity. SM count is derived from published CUDA cores per architecture. CUDA resource limits follow https://docs.nvidia.com/cuda/cuda-programming-guide/05-appendices/compute-capabilities.html . Zero fields mean unverified or unspecified, not absent hardware; power fields use board/subsystem rating as a reference envelope rather than measured draw. memory_clock_mhz stores half the effective data rate.
