notes: One exposed Blackwell GPU of the two-GPU Grace Blackwell Superchip (GB200 NVL72 and NVL4). 186 GB HBM3e and 8 TB/s per GPU per the Blackwell datasheet and the GB200 NVL72 page (372 GB per Superchip); an older DSX compute-tray page states 180 GB. Excludes Grace LPDDR. Max TDP configurable up to 1,200 W. NVIDIA tuning guide publishes 126 MiB L2 for GB200. Nominal memory capacity is represented in GiB; usable memory may be lower with ECC or firmware reservations. Typical workload power is unknown (0). Unverified fields are 0 for sm_count, memory_bus_width_bits, core_clock_mhz, memory_clock_mhz.
