notes: One exposed Blackwell Ultra GPU of the two-GPU Superchip in GB300 NVL72. 279 GB HBM3e and 8 TB/s per GPU per the Blackwell Ultra datasheet (20 TB per NVL72 rack); an older DSX compute-tray page states 288 GB. Excludes Grace LPDDR. Max TDP configurable up to 1,400 W. PCI ID 0x31C2 from the NVIDIA driver supported-chips list, which also lists 0x31C3 without a public product mapping. Nominal memory capacity is represented in GiB; usable memory may be lower with ECC or firmware reservations. Typical workload power is unknown (0). Unverified fields are 0 for sm_count, memory_bus_width_bits, core_clock_mhz, memory_clock_mhz, l2_cache_bytes.
